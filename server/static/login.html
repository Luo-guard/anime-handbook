<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>欢迎 · 动漫手账</title><link rel="stylesheet" href="/online.css"><script src="/login.js" defer></script></head>
<body class="login-page"><main class="login-card"><span class="login-mark">手</span><p class="login-eyebrow">ANIME HANDBOOK</p><h1>留住追番的时光</h1><p class="login-intro">收藏喜欢的故事，记录每一次心动。<br>在电脑与手机之间，接着写你的手账。</p>
<nav class="auth-tabs" aria-label="账号入口"><button type="button" id="showLogin" aria-pressed="true">登录</button><button type="button" id="showRegister" aria-pressed="false">注册</button></nav>
<form id="loginForm"><label>用户名<input name="username" autocomplete="username" required minlength="3" maxlength="40" pattern="[a-zA-Z0-9_-]{3,40}" placeholder="3～40 位字母、数字、下划线或短横线"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="200"></label><button type="submit">登录手账</button></form>
<form id="registerForm" hidden><label>用户名<input name="username" autocomplete="username" required minlength="3" maxlength="40" pattern="[a-zA-Z0-9_-]{3,40}" placeholder="3～40 位字母、数字、下划线或短横线"></label><label>密码<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="200" placeholder="至少 12 个字符"></label><label>确认密码<input name="confirm_password" type="password" autocomplete="new-password" required minlength="12" maxlength="200"></label><label>邀请码<input name="invitation" autocomplete="off" required maxlength="200" placeholder="填写朋友分享给你的邀请码"></label><small>邀请码仅可使用一次。暂不绑定邮箱，忘记密码请联系管理员。</small><button type="submit">创建我的手账</button></form>
<p id="loginError" role="alert" aria-live="polite"></p><div class="guest-entry"><button type="button" id="guestLogin">先逛逛 · 游客体验 <span>↗</span></button><small>无需账号，浏览完整示例。游客仅可查看。</small></div></main></body></html>
