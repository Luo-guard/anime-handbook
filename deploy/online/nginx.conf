# Merge this with the HTTPS server created by your certificate provider.
# Replace handbook.example.com and certificate paths before deployment.
limit_req_zone $binary_remote_addr zone=handbook_login:10m rate=5r/m;
server {
    listen 80;
    server_name handbook.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name handbook.example.com;
    ssl_certificate /etc/letsencrypt/live/handbook.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/handbook.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    # Buffer upload bodies to disk rather than keeping each photo in RAM.
    client_body_buffer_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ ^/api/auth/(login|register|guest)$ {
        limit_req zone=handbook_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:43128;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:43128;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_request_buffering on;
        proxy_buffering on;
    }
}
