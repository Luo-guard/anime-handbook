<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>动漫手账</title><link rel="stylesheet" href="style.css"></head><body>
<header class="app-bar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">手</span>
    <div class="brand-text"><small>ANIME HANDBOOK</small><h1>动漫手账</h1></div>
  </div>
  <button id="sync" class="app-action" type="button" aria-label="同步">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19.6 12a7.6 7.6 0 0 1-13 5.3M4.4 12a7.6 7.6 0 0 1 13-5.3"/><path d="M4.4 17.3v-4.4h4.4M19.6 6.7v4.4h-4.4"/></svg>
  </button>
</header>
<main id="app"></main>
<nav aria-label="主导航">
  <button data-page="home" class="active" type="button" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12a1 1 0 0 1 1 1v15l-7-4-7 4V5a1 1 0 0 1 1-1z"/></svg>
    <span>收藏</span>
  </button>
  <button data-page="records" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
    <span>记录</span>
  </button>
  <button data-page="rules" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M14.9 9.1l-1.7 4.1-4.1 1.7 1.7-4.1 4.1-1.7z"/></svg>
    <span>规则</span>
  </button>
  <button data-page="settings" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 12h4M12 12h8M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>
    <span>设置</span>
  </button>
</nav>
<dialog id="syncConflict" aria-labelledby="syncConflictTitle" aria-describedby="syncConflictIntro">
  <form method="dialog">
    <h2 id="syncConflictTitle">选择同步版本</h2>
    <p id="syncConflictIntro">手机和坚果云的版本不同，缺少可用于自动合并的同步基准。</p>
    <button type="submit" value="local"><strong>保留手机版本</strong><span>用手机数据覆盖云端。</span></button>
    <button type="submit" value="remote"><strong>使用云端版本</strong><span>用云端数据替换本机。</span></button>
    <button type="submit" value="cancel" autofocus>暂不同步</button>
  </form>
</dialog>
<section class="page" id="rulesPage" hidden aria-label="规则与片源">
  <div class="page-head">
    <button class="page-back" id="mpRuleBack" type="button" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></button>
    <div class="page-title"><h1>规则与片源</h1><small id="mpRuleSummary">还没有安装规则</small></div>
  </div>
  <div class="page-body">
    <div class="mp-tabs" role="tablist">
      <button type="button" role="tab" data-rule-tab="find" aria-selected="true">找片源</button>
      <button type="button" role="tab" data-rule-tab="repo" aria-selected="false">规则仓库</button>
      <button type="button" role="tab" data-rule-tab="installed" aria-selected="false">已安装</button>
    </div>

    <div class="mp-rule-view" data-rule-view="find">
      <div class="card">
        <form id="mpRuleFindForm" class="inline-form">
          <input id="mpRuleQuery" placeholder="番名或关键词" aria-label="番名或关键词" required>
          <button type="submit">搜索</button>
        </form>
        <p class="hint" id="mpRuleStatus" role="status"></p>
      </div>
      <div class="mp-rule-results" id="mpRuleResults"></div>
      <div class="mp-rule-episodes" id="mpRuleEpisodes"></div>
    </div>

    <div class="mp-rule-view" data-rule-view="repo" hidden>
      <div class="rule-toolbar">
        <input id="mpRuleFilter" placeholder="筛选规则名" aria-label="筛选规则">
        <button id="mpRuleRefresh" type="button">刷新</button>
      </div>
      <p class="hint" id="mpRuleRepoStatus" role="status">规则来自 GitHub 上的 KazumiRules。</p>
      <div class="mp-rule-results" id="mpRuleRepo"></div>
    </div>

    <div class="mp-rule-view" data-rule-view="installed" hidden>
      <div class="rule-toolbar">
        <button id="mpRuleLinkImport" type="button">从链接导入</button>
        <button id="mpRulePasteImport" type="button">粘贴 JSON</button>
      </div>
      <div class="mp-rule-results" id="mpRuleInstalled"></div>
    </div>
  </div>
</section>

<dialog id="rulePasteDialog" aria-labelledby="rulePasteTitle">
  <form method="dialog">
    <h2 id="rulePasteTitle">粘贴规则 JSON</h2>
    <p>把 Kazumi 规则的完整 JSON 贴进来，保存后会出现在「已安装」。</p>
    <textarea id="rulePasteText" rows="8" placeholder='{"name":"站点名","baseURL":"https://…"}'></textarea>
    <p class="hint" id="rulePasteStatus" role="status"></p>
    <div class="dialog-actions">
      <button type="submit" value="cancel">取消</button>
      <button type="submit" value="save" class="primary">导入</button>
    </div>
  </form>
</dialog>

<section id="mobilePlayer" hidden aria-label="播放器">
  <div class="mp-stage" id="mpStage">
    <div id="offlinePlayerVideoWrap" class="mp-video">
      <div id="pcVideoSurface"><video id="offlineVideo" playsinline preload="metadata"></video></div>
      <canvas id="danmakuCanvas" aria-hidden="true"></canvas>

      <div class="mp-loading" id="mpBuffering" hidden aria-hidden="true"><i></i></div>
      <div class="mp-hud" id="mpHud" hidden><b id="mpHudMain"></b><span id="mpHudSub"></span></div>

      <div class="mp-chrome mp-top">
        <button class="mp-btn" id="mpClose" type="button" aria-label="返回">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z" fill="currentColor"/></svg>
        </button>
        <div class="mp-title"><strong id="mpTitle"></strong><small id="mpEpisodeLabel"></small></div>
        <button class="mp-btn" id="mpSkip" type="button" aria-label="快进">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l8.5-6L4 6v12zm9 0l8.5-6L13 6v12z" fill="currentColor"/></svg>
        </button>
        <button class="mp-btn" id="mpPip" type="button" aria-label="画中画">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14z" fill="currentColor"/></svg>
        </button>
        <button class="mp-btn mp-danmaku" id="mpDanmakuQuick" type="button" aria-label="弹幕" aria-pressed="true">弹</button>
        <button class="mp-btn" id="mpWatched" type="button" aria-label="记录已看">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="currentColor"/></svg>
        </button>
        <button class="mp-btn" id="mpMore" type="button" aria-label="更多选项">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" fill="currentColor"/></svg>
        </button>
      </div>

      <div class="mp-chrome mp-bottom">
        <button class="mp-btn mp-play" id="mpPlay" type="button" aria-label="播放">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        </button>
        <div class="mp-progress" id="mpProgress">
          <div class="mp-track" aria-hidden="true">
            <span class="mp-bufferbar" id="mpBuffer"></span>
            <span class="mp-playedbar" id="mpPlayed"></span>
            <span class="mp-thumb" id="mpThumb"></span>
          </div>
          <input id="mpSeek" type="range" min="0" max="1000" step="1" value="0" aria-label="播放进度">
        </div>
        <span class="mp-time" id="mpTime">00:00 / 00:00</span>
        <button class="mp-btn" id="mpFullscreen" type="button" aria-label="全屏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path id="mpFullscreenPath" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" fill="currentColor"/></svg>
        </button>
      </div>

      <div class="mp-end" id="mpEndCard" hidden>
        <b>本集播放完毕</b>
        <p id="mpEndHint"></p>
        <div class="mp-end-actions">
          <button type="button" id="mpReplay">重播本集</button>
          <button type="button" class="mp-end-next" id="mpEndNext">播放下一集</button>
        </div>
      </div>

      <p class="mp-status" id="mpStatus" role="status"></p>
    </div>
  </div>

  <!-- ⋮ 更多选项：仿 Kazumi 的弹出菜单，手机上是底部列表 -->
  <section class="mp-menu" id="mpMenu" hidden aria-label="更多选项">
    <button type="button" data-menu="episodes"><span>选集</span><i id="mpMenuEpisodesValue"></i></button>
    <button type="button" data-menu="speed"><span>倍速</span><i id="mpMenuSpeedValue">1.0x</i></button>
    <button type="button" data-menu="ratio"><span>视频比例</span><i id="mpMenuRatioValue">适应</i></button>
    <button type="button" data-menu="upscale"><span>超分辨率</span><i id="mpMenuUpscaleValue">关闭</i></button>
    <button type="button" data-menu="danmaku"><span>弹幕设置</span></button>
    <button type="button" data-menu="subtitle"><span>字幕</span><i id="mpMenuSubtitleValue">未加载</i></button>
    <button type="button" data-menu="shot"><span>截图</span></button>
    <button type="button" data-menu="sources"><span>片源与规则</span></button>
    <button type="button" data-menu="pip"><span>画中画</span></button>
  </section>

  <!-- 通用选择器：倍速 / 比例 / 超分 / 快进时长 -->
  <section class="mp-sheet" id="mpPicker" hidden aria-label="选项">
    <div class="mp-sheet-head"><h2 id="mpPickerTitle">选项</h2><button class="mp-sheet-close" type="button" aria-label="关闭">×</button></div>
    <div class="mp-sheet-body" id="mpPickerBody"></div>
  </section>

  <!-- 选集：右侧抽屉（Kazumi 的侧栏） -->
  <aside class="mp-drawer" id="mpEpisodes" hidden aria-label="选集">
    <div class="mp-drawer-head"><h2>选集</h2><button class="mp-sheet-close" type="button" aria-label="关闭">×</button></div>
    <div class="mp-drawer-body" id="mpEpisodeGrid"></div>
    <select id="mpEpisode" hidden aria-hidden="true"></select>
  </aside>

  <section class="mp-sheet" id="mpSources" hidden aria-label="片源">
    <div class="mp-sheet-head"><h2>片源</h2><button class="mp-sheet-close" type="button" aria-label="关闭">×</button></div>
    <div class="mp-sheet-body">
      <button class="mp-primary-action" id="mpRulesButton" type="button">
        <b>按番名找片源</b>
        <small>用已安装的规则搜索站点</small>
      </button>
      <div class="mp-actions">
        <button id="mpOpenFile" type="button">本机视频</button>
        <button id="mpSubtitleImport" type="button">导入字幕</button>
        <button id="mpOriginal" type="button">浏览器打开</button>
        <button id="mpRemoveSource" type="button">移除当前线路</button>
      </div>
      <input type="file" id="mpFiles" accept="video/*,.mkv,.mp4,.webm,.m4v" multiple hidden>
      <input type="file" id="mpSubtitleFile" accept=".vtt,.srt" hidden>
      <label class="mp-field">当前线路<select id="mpLine" aria-label="当前线路"></select></label>
      <form id="mpAddSource" class="mp-form">
        <label class="mp-field">视频地址（HTTPS）
          <input id="mpUrl" inputmode="url" placeholder="MP4 / M3U8 直链" required>
        </label>
        <label class="mp-check"><input id="mpUseTemplate" type="checkbox"> 存成分集规则，用 {episode} 代替集数</label>
        <button type="submit">添加并播放</button>
      </form>
    </div>
  </section>

  <section class="mp-sheet" id="mpUpscale" hidden aria-label="超分辨率">
    <div class="mp-sheet-head"><h2>超分辨率</h2><button class="mp-sheet-close" type="button" aria-label="关闭">×</button></div>
    <div class="mp-sheet-body">
      <div class="mp-choice" role="radiogroup" aria-label="超分档位">
        <label><input type="radio" name="mpQuality" value="off"><span><b>关闭</b><small>原画，最省电</small></span></label>
        <label><input type="radio" name="mpQuality" value="fast"><span><b>效率档 · 2×</b><small>Kazumi 效率链，较省电</small></span></label>
        <label><input type="radio" name="mpQuality" value="quality"><span><b>质量档 · 2×</b><small>Kazumi 质量链，最吃显卡</small></span></label>
      </div>
      <select id="mpQuality" hidden aria-hidden="true"><option value="off">关闭</option><option value="fast">效率档 · 2×</option><option value="quality">质量档 · 2×</option></select>
      <p id="mpQualityStatus" class="mp-hint" role="status"></p>
    </div>
  </section>

  <section class="mp-sheet" id="mpDanmakuSource" hidden aria-label="弹幕源">
    <div class="mp-sheet-head"><h2>弹幕源</h2><button class="mp-sheet-close" type="button" aria-label="关闭">×</button></div>
    <div class="mp-sheet-body">
      <form id="mpDanmakuConfig" class="mp-form">
        <label class="mp-field">来源<select id="mpDmMode"><option value="public">社区公共源</option><option value="dandanplay">弹弹play 官方</option><option value="custom">兼容服务</option></select></label>
        <label class="mp-field">兼容服务地址<input id="mpDmBase" inputmode="url" placeholder="https://"></label>
        <label class="mp-field">AppId<input id="mpDmId" autocomplete="off"></label>
        <label class="mp-field">AppSecret<input id="mpDmSecret" type="password" autocomplete="off"></label>
        <button type="submit">保存弹幕源</button>
      </form>
    </div>
  </section>

  <section class="danmaku-panel hidden" id="danmakuPanel" aria-labelledby="dmPanelTitle">
    <div class="danmaku-panel-head">
      <h3 id="dmPanelTitle">弹幕</h3>
      <button type="button" id="dmPanelClose" aria-label="关闭弹幕设置">×</button>
    </div>
    <div class="danmaku-panel-body">
      <div class="danmaku-status">
        <div><strong id="dmProvider">公共弹幕源</strong><p id="dmSource" role="status">还没有加载弹幕</p></div>
        <b id="dmCount">0 条</b>
      </div>
      <form class="danmaku-search" id="dmSearchForm">
        <label for="dmQuery">按番名搜索弹幕</label>
        <div>
          <input type="search" id="dmQuery" placeholder="输入番名" required />
          <button type="submit" class="primary-button compact-button" id="dmOnlineSearch">搜索</button>
        </div>
      </form>
      <div class="danmaku-match hidden" id="dmMatchRow">
        <label for="dmMatch">选择分集</label>
        <select id="dmMatch"></select>
        <button type="button" class="primary-button compact-button" id="dmUseMatch">加载这集弹幕</button>
      </div>
      <div class="danmaku-actions">
        <button type="button" class="text-button" id="dmImport">导入文件</button>
        <button type="button" class="text-button" id="dmReload">重新加载</button>
        <button type="button" class="text-button" id="dmConfigure">配置弹幕源</button>
        <input type="file" id="dmFile" accept=".xml,.json" hidden />
      </div>
      <details class="danmaku-display">
        <summary>显示与过滤</summary>
        <label class="danmaku-row"><span>显示弹幕</span><span class="switch-row compact"><input type="checkbox" id="dmEnabled" /><span class="switch"></span></span></label>
        <label class="danmaku-row"><span>字号 <b id="dmFontSizeValue">24</b></span><input type="range" id="dmFontSize" min="16" max="40" step="1" /></label>
        <label class="danmaku-row"><span>滚动时长 <b id="dmDurationValue">8</b> 秒</span><input type="range" id="dmDuration" min="4" max="16" step="1" /></label>
        <label class="danmaku-row"><span>不透明度 <b id="dmOpacityValue">0.92</b></span><input type="range" id="dmOpacity" min="0.3" max="1" step="0.02" /></label>
        <label class="danmaku-row"><span>显示区域 <b id="dmAreaValue">0.5</b></span><input type="range" id="dmArea" min="0.25" max="1" step="0.25" /></label>
        <label class="danmaku-row"><span>同屏上限 <b id="dmDensityValue">0</b></span><input type="range" id="dmDensity" min="0" max="60" step="5" /></label>
        <label class="danmaku-row"><span>粗体弹幕</span><span class="switch-row compact"><input type="checkbox" id="dmBold" /><span class="switch"></span></span></label>
        <label class="danmaku-row"><span>顶底弹幕</span><span class="switch-row compact"><input type="checkbox" id="dmTopBottom" /><span class="switch"></span></span></label>
        <label class="danmaku-row stacked"><span>屏蔽词（逗号分隔）</span><input type="text" id="dmShield" placeholder="剧透, 广告" /></label>
      </details>
      <form id="mpSend" class="mp-send">
        <input id="dmSendInput" placeholder="发一条本机弹幕" maxlength="100" aria-label="弹幕内容">
        <button id="dmSendButton">发送</button>
      </form>
    </div>
  </section>

  <button id="offlineDanmakuToggle" type="button" hidden aria-hidden="true">弹幕</button>
  <button id="offlineDanmakuSettings" type="button" hidden aria-hidden="true">弹幕设置</button>
</section>
<script src="app.js"></script><script src="modules/danmaku.js"></script><script src="rules.js"></script><script src="player.js"></script></body></html>
