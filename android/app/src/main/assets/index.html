<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>动漫手账</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><small>ANIME HANDBOOK</small><h1>动漫手账</h1></div><button id="sync">同步</button></header>
<main id="app"></main>
<nav><button data-page="home" class="active">收藏</button><button data-page="records">记录</button><button type="button" onclick="window.HandbookPlayer.show()">播放</button><button data-page="settings">设置</button></nav>
<dialog id="syncConflict" aria-labelledby="syncConflictTitle" aria-describedby="syncConflictIntro">
  <form method="dialog">
    <h2 id="syncConflictTitle">选择同步版本</h2>
    <p id="syncConflictIntro">手机和坚果云的版本不同，缺少可用于自动合并的同步基准。</p>
    <button type="submit" value="local"><strong>保留手机版本</strong><span>用手机数据覆盖云端。</span></button>
    <button type="submit" value="remote"><strong>使用云端版本</strong><span>用云端数据替换本机。</span></button>
    <button type="submit" value="cancel" autofocus>暂不同步</button>
  </form>
</dialog>
<section id="mobilePlayer" hidden aria-label="播放器">
  <div id="offlinePlayerVideoWrap" class="mobile-video-wrap">
    <div id="pcVideoSurface"><video id="offlineVideo" playsinline preload="metadata"></video></div>
    <canvas id="danmakuCanvas" aria-hidden="true"></canvas>
    <div class="mobile-video-top">
      <button id="mpClose" type="button" aria-label="退出播放器">‹</button>
      <strong id="mpTitle"></strong>
      <button id="mpUpscaleButton" type="button" aria-controls="mpUpscale">超分</button>
      <button id="mpShot" type="button">截图</button>
    </div>
    <div class="mobile-video-bottom">
      <input id="mpSeek" type="range" min="0" max="1000" value="0" aria-label="播放进度">
      <div class="mobile-video-row">
        <button id="mpPrevious" type="button">上一集</button><button id="mpPlay" type="button">播放</button><button id="mpNext" type="button">下一集</button>
        <span id="mpTime">00:00 / 00:00</span>
        <button id="mpEpisodesButton" type="button">选集</button><button id="mpFullscreen" type="button">全屏</button>
      </div>
    </div>
          <section class="danmaku-panel hidden" id="danmakuPanel" aria-labelledby="dmPanelTitle">
            <div class="danmaku-panel-head">
              <h3 id="dmPanelTitle">弹幕</h3>
              <button type="button" id="dmPanelClose" aria-label="关闭弹幕设置">×</button>
            </div>
            <div class="danmaku-panel-body">
              <div class="danmaku-status">
                <div><strong id="dmProvider">公共弹幕源</strong><p id="dmSource" role="status">还没有加载弹幕</p></div>
                <b id="dmCount">0 条</b>
              </div>
              <form class="danmaku-search" id="dmSearchForm">
                <label for="dmQuery">按番名搜索弹幕</label>
                <div>
                  <input type="search" id="dmQuery" placeholder="输入番名" required />
                  <button type="submit" class="primary-button compact-button" id="dmOnlineSearch">搜索</button>
                </div>
              </form>
              <div class="danmaku-match hidden" id="dmMatchRow">
                <label for="dmMatch">选择分集</label>
                <select id="dmMatch"></select>
                <button type="button" class="primary-button compact-button" id="dmUseMatch">加载这集弹幕</button>
              </div>
              <div class="danmaku-actions">
                <button type="button" class="text-button" id="dmImport">导入文件</button>
                <button type="button" class="text-button" id="dmReload">重新加载</button>
                <button type="button" class="text-button" id="dmConfigure">配置弹幕源</button>
                <input type="file" id="dmFile" accept=".xml,.json" hidden />
              </div>
              <details class="danmaku-display">
                <summary>显示与过滤</summary>
                <label class="danmaku-row"><span>显示弹幕</span><span class="switch-row compact"><input type="checkbox" id="dmEnabled" /><span class="switch"></span></span></label>
                <label class="danmaku-row"><span>字号 <b id="dmFontSizeValue">24</b></span><input type="range" id="dmFontSize" min="16" max="40" step="1" /></label>
                <label class="danmaku-row"><span>滚动时长 <b id="dmDurationValue">8</b> 秒</span><input type="range" id="dmDuration" min="4" max="16" step="1" /></label>
                <label class="danmaku-row"><span>不透明度 <b id="dmOpacityValue">0.92</b></span><input type="range" id="dmOpacity" min="0.3" max="1" step="0.02" /></label>
                <label class="danmaku-row"><span>显示区域 <b id="dmAreaValue">0.5</b></span><input type="range" id="dmArea" min="0.25" max="1" step="0.25" /></label>
                <label class="danmaku-row"><span>同屏上限 <b id="dmDensityValue">0</b></span><input type="range" id="dmDensity" min="0" max="60" step="5" /></label>
                <label class="danmaku-row"><span>粗体弹幕</span><span class="switch-row compact"><input type="checkbox" id="dmBold" /><span class="switch"></span></span></label>
                <label class="danmaku-row"><span>顶底弹幕</span><span class="switch-row compact"><input type="checkbox" id="dmTopBottom" /><span class="switch"></span></span></label>
                <label class="danmaku-row stacked"><span>屏蔽词（逗号分隔）</span><input type="text" id="dmShield" placeholder="剧透, 广告" /></label>
              </details>
            </div>
          </section>
  </div>
  <div class="mobile-tools">
    <p id="mpStatus" role="status"></p>
    <div class="mobile-video-row">
      <button id="mpSkip" type="button">快进</button><button id="mpMute" type="button">静音</button>
      <label>音量<input id="mpVolume" type="range" min="0" max="1" step="0.05" aria-label="音量"></label>
      <label>倍速<select id="mpSpeed" aria-label="倍速"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option><option>3</option></select></label>
      <button id="mpPip" type="button">小窗</button>
    </div>
    <div class="mobile-video-row">
      <button id="offlineDanmakuToggle" type="button">弹幕</button><button id="offlineDanmakuSettings" type="button">弹幕设置</button>
      <button id="mpSubtitle" type="button">字幕</button><button id="mpSourcesButton" type="button">片源</button>
      <button id="mpWatched" type="button">记录已看</button>
    </div>
    <form id="mpSend" class="mobile-video-row"><input id="dmSendInput" placeholder="发一条本机弹幕" maxlength="100" aria-label="弹幕内容"><button id="dmSendButton">发送</button></form>
  </div>
  <section id="mpEpisodes" class="mobile-player-sheet" hidden><h2>选集</h2><select id="mpEpisode" size="5" aria-label="选集"></select></section>
  <section id="mpUpscale" class="mobile-player-sheet" hidden><h2>Anime4K 超分</h2>
    <select id="mpQuality" aria-label="超分画质"><option value="off">关闭</option><option value="fast">轻量 · 2×</option><option value="quality">画质 · 2×</option></select><p id="mpQualityStatus" role="status"></p>
  </section>
  <section id="mpSources" class="mobile-player-sheet" hidden><h2>播放片源</h2>
    <div class="mobile-video-row"><button id="mpOpenFile" type="button">打开本机视频</button><button id="mpOriginal" type="button">打开片源链接 ↗</button><button id="mpSubtitleImport" type="button">导入字幕</button></div>
    <input type="file" id="mpFiles" accept="video/*,.mkv,.mp4,.webm,.m4v" multiple hidden>
    <input type="file" id="mpSubtitleFile" accept=".vtt,.srt" hidden>
    <label>当前线路<select id="mpLine"></select></label>
    <form id="mpAddSource"><label>HTTPS 视频地址<input id="mpUrl" inputmode="url" placeholder="MP4 或 M3U8 地址" required></label>
      <label><input id="mpUseTemplate" type="checkbox"> 作为分集规则保存，地址中用 {episode} 或 {key} 代替集数</label>
      <div class="mobile-video-row"><button>添加并播放</button><button id="mpRemoveSource" type="button">移除所选线路</button></div>
    </form>
    <label>快进步长（秒）<input id="mpSkipSeconds" type="number" min="1" max="600" inputmode="numeric"></label>
  </section>
  <section id="mpDanmakuSource" class="mobile-player-sheet" hidden><h2>弹幕源</h2>
    <form id="mpDanmakuConfig">
      <label>来源<select id="mpDmMode"><option value="public">社区公共源</option><option value="dandanplay">弹弹play 官方</option><option value="custom">兼容服务</option></select></label>
      <label>兼容服务地址<input id="mpDmBase" inputmode="url" placeholder="https://"></label>
      <label>AppId<input id="mpDmId" autocomplete="off"></label>
      <label>AppSecret<input id="mpDmSecret" type="password" autocomplete="off"></label>
      <button>保存弹幕源</button>
    </form>
  </section>
</section>
<script src="app.js"></script><script src="modules/danmaku.js"></script><script src="player.js"></script></body></html>
